# cargo audit ignore file — convenience copy; canonical config is .cargo/audit.toml
# (cargo audit reads .cargo/audit.toml automatically; this file documents the
# same exceptions for human reviewers browsing the repo root.)
#
# Each entry below is a known transitive-dependency advisory that cannot be
# resolved without an upstream change in the Soroban SDK. All are tracked in
# GitHub issue #230.

[advisories]
# Warn when an ignored advisory is no longer present (helps keep this list tidy)
warn_unused_ignores = true

ignore = [
    # RUSTSEC-2026-0387: crypto-bigint 0.5.5 — timing variability in
    # constant-time operations. Transitive dep via soroban-env-host →
    # elliptic-curve 0.13.x. Fix requires crypto-bigint >=0.7.6 (incompatible
    # semver); no Soroban SDK version currently pulls that in.
    # Reviewed 2026-11-30 · issue #230
    "RUSTSEC-2026-0387",

    # RUSTSEC-2024-0388: derivative 2.2.0 — unmaintained.
    # Transitive dep via soroban-env-host / ark-* crates.
    # Reviewed 2026-11-30 · issue #230
    "RUSTSEC-2024-0388",

    # RUSTSEC-2024-0436: paste 1.0.15 — unmaintained.
    # Transitive dep via soroban SDK macro crates.
    # Reviewed 2026-11-30 · issue #230
    "RUSTSEC-2024-0436",
]
