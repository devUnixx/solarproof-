[package]
name = "contracts-proptest"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
proptest = "1.6.0"
soroban-sdk = { version = "23.1.0", features = ["testutils"] }
energy-token = { path = "../energy_token" }
community-governance = { path = "../community_governance" }

# Force resolution of crypto-bigint to a patched version (>=0.7.6) to address
# RUSTSEC-2026-0387 (timing variability issues in constant-time operations).
[patch.crates-io]
crypto-bigint = "0.7.6"

# Excluded from the main workspace to keep it isolated (like the fuzz crate).
[workspace]