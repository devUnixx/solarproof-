[package]
name = "fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { version = "23.1.0", features = ["testutils"] }
energy-token = { path = "../energy_token" }
audit-registry = { path = "../audit_registry" }
community-governance = { path = "../community_governance" }

# Force patched versions of transitive dependencies flagged by cargo audit.
# crypto-bigint <0.7.6 has timing variability issues (RUSTSEC-2026-0387).
# derivative (RUSTSEC-2024-0388) and paste (RUSTSEC-2024-0436) are unmaintained;
# spin 0.9.8 is yanked. Pin to safe/patched releases.
[patch.crates-io]
crypto-bigint = "0.7.6"

# Prevent this from being included in the workspace
[workspace]

[[bin]]
name = "fuzz_mint"
path = "fuzz_targets/fuzz_mint.rs"
test = false
doc = false

[[bin]]
name = "fuzz_anchor"
path = "fuzz_targets/fuzz_anchor.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vote"
path = "fuzz_targets/fuzz_vote.rs"
test = false
doc = false

[[bin]]
name = "fuzz_governance"
path = "fuzz_targets/fuzz_governance.rs"
test = false
doc = false