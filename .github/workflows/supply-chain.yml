name: Supply Chain Verification

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # weekly on Monday

jobs:
  npm-provenance:
    name: npm audit signatures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@fe02b34f78d792f169897fdad87c0d8f5d1b1e7f # v4.0.0
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: npm audit signatures

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: EmbarkStudios/cargo-deny-action@837b8f6c1b0e4a7f9c3f5f0e2b8d4a6c1e9f7d3a # v2.0.4
        with:
          manifest-path: apps/contracts/Cargo.toml
          command: check
          arguments: --config apps/contracts/deny.toml

  pinned-actions:
    name: Verify actions are pinned to full SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan workflows for un-pinned actions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(.github/workflows/*.yml .github/workflows/*.yaml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No workflow files found."
            exit 0
          fi

          sha_re='^[0-9a-fA-F]{40}$'
          failed=0

          for file in "${files[@]}"; do
            while IFS= read -r line; do
              # Extract the value after "uses:" (strip comments and whitespace)
              ref="${line#*uses:}"
              ref="${ref%%#*}"
              ref="$(echo "$ref" | xargs)"

              # Skip empty refs
              [ -z "$ref" ] && continue

              # Allow local actions and docker images
              case "$ref" in
                ./*|docker://*) continue ;;
              esac

              # Expect form: owner/repo(/path)@<40-hex-sha>
              if [[ "$ref" != *"@"* ]]; then
                echo "::error file=$file::Un-pinned action reference (missing @SHA): $ref"
                failed=1
                continue
              fi

              sha="${ref##*@}"
              if ! [[ "$sha" =~ $sha_re ]]; then
                echo "::error file=$file::Action not pinned to a full 40-character SHA: $ref"
                failed=1
              fi
            done < <(grep -E '^[[:space:]]*(-[[:space:]]+)?uses:' "$file" || true)
          done

          if [ "$failed" -ne 0 ]; then
            echo "One or more actions are not pinned to a full commit SHA."
            exit 1
          fi

          echo "All action references are pinned to full commit SHAs."