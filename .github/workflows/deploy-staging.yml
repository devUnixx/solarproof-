name: Deploy Staging

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  # ── 1. Run CI gate before deploying ─────────────────────────────────────────
  test:
    name: Test before staging deploy
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        working-directory: apps/web
        env:
          REDIS_URL: redis://localhost:6379

  # ── 2. Deploy to Vercel staging ──────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Vercel (staging)
    runs-on: ubuntu-latest
    needs: test
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check schema parity (staging vs production)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_STAGING }}
          PRODUCTION_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF_PRODUCTION }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || \
             [ -z "${STAGING_PROJECT_REF:-}" ] || \
             [ -z "${PRODUCTION_PROJECT_REF:-}" ]; then
            echo "::error::Missing Supabase secrets (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF_STAGING, SUPABASE_PROJECT_REF_PRODUCTION)"
            exit 1
          fi

          fetch_migrations() {
            local ref="$1"
            pnpm dlx supabase@latest migration list \
              --project-ref "$ref" \
              --output json 2>/dev/null \
              | jq -r '.migrations[] | select(.local == null or .remote != null) | .version' \
              | sort -u
          }

          echo "Fetching production migration history…"
          fetch_migrations "$PRODUCTION_PROJECT_REF" > /tmp/prod_migrations.txt

          echo "Fetching staging migration history…"
          fetch_migrations "$STAGING_PROJECT_REF" > /tmp/staging_migrations.txt

          echo "Production migrations: $(wc -l < /tmp/prod_migrations.txt)"
          echo "Staging migrations:    $(wc -l < /tmp/staging_migrations.txt)"

          MISSING=$(comm -23 /tmp/prod_migrations.txt /tmp/staging_migrations.txt || true)

          if [ -n "$MISSING" ]; then
            echo "::error::Staging is behind production — missing migrations:"
            echo "$MISSING"
            {
              echo "### ❌ Schema drift detected"
              echo ""
              echo "Staging is missing the following migrations present in production:"
              echo '```'
              echo "$MISSING"
              echo '```'
              echo ""
              echo "See docs/runbooks/schema-drift.md for resolution steps."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✓ Staging migration history matches or is ahead of production"

      - name: Deploy to Vercel (staging project)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAGING }}
        run: |
          url=$(pnpm dlx vercel deploy \
            --token "$VERCEL_TOKEN" \
            --scope "$VERCEL_ORG_ID" \
            --yes \
            apps/web 2>&1 | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health check staging
        run: |
          URL="${{ steps.deploy.outputs.url }}/api/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check $i passed ✓"
              exit 0
            fi
            echo "Health check $i: HTTP $STATUS — retrying in 15 s"
            sleep 15
          done
          echo "Staging health check failed" && exit 1

      - name: Post staging URL to summary
        run: echo "### 🚀 Staging deployed" >> $GITHUB_STEP_SUMMARY && echo "${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
