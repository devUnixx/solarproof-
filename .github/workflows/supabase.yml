name: Supabase schema

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/**'
      - 'scripts/check-migration-drift.sh'
      - 'scripts/check-migration-rollback.sh'

jobs:
  validate:
    name: Validate migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply all migrations (forward)
        run: supabase db reset

      - name: Verify rollback scripts exist for every migration
        run: |
          missing=0
          for f in supabase/migrations/*.sql; do
            base=$(basename "$f" .sql)
            down="supabase/migrations/rollbacks/${base}.down.sql"
            if [ ! -f "$down" ]; then
              echo "Missing rollback: $down"
              missing=1
            fi
          done
          exit $missing

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  migration-rollback:
    name: Migration rollback test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply all migrations (forward)
        run: supabase db reset

      - name: Run migration rollback check
        env:
          # Point to the local Supabase instance started above.
          # supabase start exposes postgres on port 54322 by default.
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          echo "### Migration Rollback Test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if bash scripts/check-migration-rollback.sh; then
            echo "✅ All rollback scripts applied cleanly and schema returned to previous state." >> "$GITHUB_STEP_SUMMARY"
          else
            EXIT_CODE=$?
            echo "❌ Migration rollback test failed — see logs above." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action required:** A rollback script is broken or does not restore the previous schema." >> "$GITHUB_STEP_SUMMARY"
            echo "Fix the rollback in supabase/migrations/rollbacks/ before merging." >> "$GITHUB_STEP_SUMMARY"
            exit $EXIT_CODE
          fi

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  migration-drift:
    name: Migration drift detection
    runs-on: ubuntu-latest
    # Run on every PR that touches migrations or the drift-check script itself
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local stack
        run: supabase start

      - name: Apply all migrations (forward)
        run: supabase db reset

      - name: Run migration drift check
        env:
          # Point to the local Supabase instance started above.
          # supabase start exposes postgres on port 54322 by default.
          DATABASE_URL: postgresql://postgres:postgres@localhost:54322/postgres
        run: |
          echo "### Migration Drift Detection" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if bash scripts/check-migration-drift.sh; then
            echo "✅ No migration drift detected." >> "$GITHUB_STEP_SUMMARY"
          else
            EXIT_CODE=$?
            echo "❌ Migration drift detected — see logs above." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Action required:** A migration file has been modified after being applied." >> "$GITHUB_STEP_SUMMARY"
            echo "Create a new migration rather than editing an existing one." >> "$GITHUB_STEP_SUMMARY"
            exit $EXIT_CODE
          fi

      - name: Verify rollback scripts exist for modified migrations
        run: |
          # Get the list of migration files changed in this PR
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'supabase/migrations/*.sql' | grep -v '/rollbacks/' || true)

          if [[ -z "$CHANGED" ]]; then
            echo "No migration files changed in this PR."
            exit 0
          fi

          echo "Changed migrations in this PR:"
          echo "$CHANGED"

          missing=0
          while IFS= read -r f; do
            base=$(basename "$f" .sql)
            down="supabase/migrations/rollbacks/${base}.down.sql"
            if [ ! -f "$down" ]; then
              echo "::error file=$f::Missing rollback script: $down"
              missing=1
            else
              echo "✅ Rollback exists for $base"
            fi
          done <<< "$CHANGED"

          if [[ $missing -eq 1 ]]; then
            echo "::error::One or more migrations are missing rollback scripts. Add them to supabase/migrations/rollbacks/."
            exit 1
          fi

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: validate
    # Only deploy on pushes to main that affect Edge Functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed Edge Functions
        id: changed
        run: |
          # Determine which Edge Functions changed in this push.
          # Fall back to deploying all functions if the diff cannot be computed.
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base commit; deploying all Edge Functions."
            CHANGED=$(ls -d supabase/functions/*/ 2>/dev/null | xargs -n1 basename || true)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- 'supabase/functions/**' \
              | awk -F/ '/^supabase\/functions\// {print $3}' \
              | sort -u || true)
          fi

          if [[ -z "$CHANGED" ]]; then
            echo "No Edge Function changes detected."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed Edge Functions:"
            echo "$CHANGED"
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "list<<EOF" >> "$GITHUB_OUTPUT"
            echo "$CHANGED" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy process-anchor-mint Edge Function
        if: steps.changed.outputs.any == 'true' && contains(steps.changed.outputs.list, 'process-anchor-mint')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets must be set."
            exit 1
          fi
          supabase functions deploy process-anchor-mint \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy other changed Edge Functions
        if: steps.changed.outputs.any == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_PROJECT_REF" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF secrets must be set."
            exit 1
          fi
          while IFS= read -r fn; do
            [[ -z "$fn" ]] && continue
            [[ "$fn" == "process-anchor-mint" ]] && continue
            echo "Deploying Edge Function: $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF"
          done <<< "${{ steps.changed.outputs.list }}"