name: Release

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      update_wasm_snapshot:
        description: 'Update WASM size snapshot (deliberate update)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wasm-size-snapshot:
    name: WASM Size Snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            apps/contracts/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build release WASM
        run: |
          cd apps/contracts
          cargo build --release --target wasm32-unknown-unknown

      - name: Record WASM sizes
        run: |
          node scripts/wasm-size-snapshot.mjs record

      - name: Check WASM sizes against snapshot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_wasm_snapshot != true }}
        run: |
          node scripts/wasm-size-snapshot.mjs check

      - name: Update WASM size snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_wasm_snapshot == true }}
        run: |
          node scripts/wasm-size-snapshot.mjs update

      - name: Commit updated snapshot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_wasm_snapshot == true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/contracts/wasm-size-snapshot.json
          git diff --cached --quiet || git commit -m "chore(contracts): update WASM size snapshot"
          git push
