name: Blue-Green Deploy

# Closes #63 — smoke test gate before traffic cut-over.
# smoke-test.mjs runs against the green (preview) slot after deployment;
# the promote step only executes if the smoke test exits 0.
# A failed smoke test sends a Slack/email notification and aborts the workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_canary:
        description: 'Skip canary stage (hotfix only)'
        type: boolean
        default: false

jobs:
  deploy:
    name: Deploy → smoke test → canary → promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Canary tuning (see issue #704)
      CANARY_ERROR_THRESHOLD: '1'      # percent
      CANARY_INITIAL_PERCENT: '10'
      CANARY_MID_PERCENT: '50'
      CANARY_FINAL_PERCENT: '100'
      CANARY_HOLD_SECONDS: '300'       # 5 minutes at 10%
      CANARY_STAGE_SECONDS: '300'      # 5 minutes per promotion stage (10→50→100 = 15 min)
      PROD_HEALTH_URL: 'https://solarproof.vercel.app/api/health'
      PROD_METRICS_URL: 'https://solarproof.vercel.app/api/metrics/error-rate'
=======

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # ── Node / pnpm (required by smoke-test.mjs) ─────────────────────────
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.6.5

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ── Deploy to Vercel preview (green slot) ─────────────────────────────
      - name: Deploy to Vercel preview (green)
        id: deploy
        run: |
          PREVIEW_URL=$(npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} \
            --yes 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # ── Health checks against green ───────────────────────────────────────
      - name: Health checks against green
        run: |
          URL="${{ steps.deploy.outputs.preview_url }}/api/health"
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Health check $i passed"
            else
              echo "Health check $i failed (HTTP $STATUS)"
              exit 1
            fi
            sleep 10
          done

      # ── Smoke test against green slot (gate before cut-over) ─────────────
      # Traffic is NOT cut over if this step fails (exit non-zero).
      - name: Run smoke test against green slot
        id: smoke
        run: node scripts/smoke-test.mjs
        env:
          SMOKE_NETWORK:                testnet
          ENERGY_TOKEN_ID:              ${{ secrets.ENERGY_TOKEN_ID }}
          AUDIT_REGISTRY_ID:            ${{ secrets.AUDIT_REGISTRY_ID }}
          SMOKE_METER_SECRET_KEY:       ${{ secrets.SMOKE_METER_SECRET_KEY }}
          SMOKE_TOKEN_MINTER_SECRET_KEY: ${{ secrets.SMOKE_TOKEN_MINTER_SECRET_KEY }}
          # Point the smoke test at the green preview URL
          NEXT_PUBLIC_STELLAR_RPC_URL:  ${{ steps.deploy.outputs.preview_url }}

      # ── Canary: shift 10% traffic to green, monitor error rate ────────────
      # Skipped when workflow_dispatch input skip_canary is true (hotfixes).
      - name: Canary 10% traffic to green
        id: canary
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_canary != true }}
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"

          echo "Routing ${CANARY_INITIAL_PERCENT}% of traffic to ${PREVIEW_URL}"
          npx vercel alias set "$PREVIEW_URL" solarproof.vercel.app \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }} || true

          # Canary routing is driven by the edge config; set the weight.
          curl -s -X POST "https://solarproof.vercel.app/api/canary/weight" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${{ secrets.CANARY_CONTROL_TOKEN }}" \
            -d "{\"percent\": ${CANARY_INITIAL_PERCENT}, \"target\": \"${PREVIEW_URL}\"}"

          echo "Holding ${CANARY_INITIAL_PERCENT}% canary for ${CANARY_HOLD_SECONDS}s while polling error rate..."
          END=$(( $(date +%s) + CANARY_HOLD_SECONDS ))
          while [ "$(date +%s)" -lt "$END" ]; do
            RATE=$(curl -s --max-time 10 "$PROD_METRICS_URL" | jq -r '.error_rate_percent // 0')
            echo "Error rate: ${RATE}% (threshold ${CANARY_ERROR_THRESHOLD}%)"
            if awk "BEGIN { exit !(${RATE} > ${CANARY_ERROR_THRESHOLD}) }"; then
              echo "::error::Canary error rate ${RATE}% exceeds ${CANARY_ERROR_THRESHOLD}% — rolling back"
              curl -s -X POST "https://solarproof.vercel.app/api/canary/weight" \
                -H 'Content-Type: application/json' \
                -H "Authorization: Bearer ${{ secrets.CANARY_CONTROL_TOKEN }}" \
                -d '{"percent": 0}'
              exit 1
            fi
            sleep 30
          done
          echo "Canary at ${CANARY_INITIAL_PERCENT}% passed error-rate checks"

      # ── Gradual promotion: 10% → 50% → 100% over 15 minutes ──────────────
      - name: Gradual promotion 10% → 50% → 100%
        id: promote
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.skip_canary != true }}
        run: |
          set -euo pipefail
          PREVIEW_URL="${{ steps.deploy.outputs.preview_url }}"

          promote_stage() {
            local percent="$1"
            echo "Promoting to ${percent}% traffic"
            curl -s -X POST "https://solarproof.vercel.app/api/canary/weight" \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${{ secrets.CANARY_CONTROL_TOKEN }}" \
              -d "{\"percent\": ${percent}, \"target\": \"${PREVIEW_URL}\"}"

            local end=$(( $(date +%s) + CANARY_STAGE_SECONDS ))
            while [ "$(date +%s)" -lt "$end" ]; do
              local rate
              rate=$(curl -s --max-time 10 "$PROD_METRICS_URL" | jq -r '.error_rate_percent // 0')
              echo "  [${percent}%] error rate: ${rate}%"
              if awk "BEGIN { exit !(${rate} > ${CANARY_ERROR_THRESHOLD}) }"; then
                echo "::error::Error rate ${rate}% exceeds ${CANARY_ERROR_THRESHOLD}% at ${percent}% — rolling back"
                curl -s -X POST "https://solarproof.vercel.app/api/canary/weight" \
                  -H 'Content-Type: application/json' \
                  -H "Authorization: Bearer ${{ secrets.CANARY_CONTROL_TOKEN }}" \
                  -d '{"percent": 0}'
                exit 1
              fi
              sleep 30
            done
          }

          promote_stage "${CANARY_MID_PERCENT}"
          promote_stage "${CANARY_FINAL_PERCENT}"
          echo "Traffic fully promoted to green"

      # ── Promote green → production (skip canary path / final cut-over) ────
      - name: Promote green to production
        run: |
          npx vercel promote ${{ steps.deploy.outputs.preview_url }} \
            --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_ORG_ID }}

      - name: Verify production health
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 \
            "$PROD_HEALTH_URL")
          [ "$STATUS" = "200" ] || (echo "Production health check failed" && exit 1)

      # ── Sentry release / deploy tracking ──────────────────────────────────
      - name: Report deployment to Sentry
        if: success()
        run: |
          VERSION="${{ github.sha }}"
          npx --yes @sentry/cli@2 releases new "$VERSION" \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --auth-token "$SENTRY_AUTH_TOKEN" || true
          npx --yes @sentry/cli@2 releases set-commits "$VERSION" --auto \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --auth-token "$SENTRY_AUTH_TOKEN" || true
          npx --yes @sentry/cli@2 releases deploys "$VERSION" new \
            -e production \
            --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            --auth-token "$SENTRY_AUTH_TOKEN"
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Failure notification (smoke test or deploy failure) ─────────────────────
  notify-failure:
    name: Notify on smoke-test / deploy failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Post failure summary
        run: |
          echo "## ❌ Blue-green deployment FAILED" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Production traffic was **not** fully cut over. If the canary stage failed, traffic was rolled back to the previous version." >> "$GITHUB_STEP_SUMMARY"
          echo "See the [blue-green runbook](../docs/runbook/blue-green-deployment.md) for rollback steps." >> "$GITHUB_STEP_SUMMARY"

      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"❌ *Blue-green deployment FAILED* — canary rolled back / cut-over aborted\",
              \"attachments\": [{
                \"color\": \"danger\",
                \"fields\": [
                  {\"title\": \"Commit\",   \"value\": \"\`${{ github.sha }}\`\",  \"short\": true},
                  {\"title\": \"Actor\",    \"value\": \"\`${{ github.actor }}\`\", \"short\": true},
                  {\"title\": \"Run\",      \"value\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\", \"short\": false},
                  {\"title\": \"Runbook\",  \"value\": \"docs/runbook/blue-green-deployment.md\", \"short\": false}
                ]
              }]
            }"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
