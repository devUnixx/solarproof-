name: Dependency Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        id: npm_audit
        run: pnpm audit --audit-level=high 2>&1 | tee /tmp/npm-audit.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Post audit results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/npm-audit.txt', 'utf8');
            const status = '${{ steps.npm_audit.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${status} pnpm audit\n\`\`\`\n${output.slice(0, 6000)}\n\`\`\``
            });
      - name: Create Issue on failure (Scheduled)
        if: github.event_name == 'schedule' && steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/npm-audit.txt', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Weekly pnpm audit failed: High-severity vulnerabilities detected',
              body: `The weekly pnpm audit found high-severity vulnerabilities in JS dependencies.\n\n### Audit Output:\n\`\`\`\n${output.slice(0, 6000)}\n\`\`\``,
              labels: ['security', 'devops']
            });
      - name: Fail if audit found high/critical issues
        if: steps.npm_audit.outcome == 'failure'
        run: exit 1

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/contracts
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        id: cargo_audit
        run: cargo audit 2>&1 | tee /tmp/cargo-audit.txt; exit ${PIPESTATUS[0]}
        working-directory: apps/contracts
        continue-on-error: true
      - name: Post audit results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/cargo-audit.txt', 'utf8');
            const status = '${{ steps.cargo_audit.outcome }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ${status} cargo audit\n\`\`\`\n${output.slice(0, 6000)}\n\`\`\``
            });
      - name: Create Issue on failure (Scheduled)
        if: github.event_name == 'schedule' && steps.cargo_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/cargo-audit.txt', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Weekly cargo audit failed: Vulnerabilities detected',
              body: `The weekly cargo audit found vulnerabilities in Rust dependencies.\n\n### Audit Output:\n\`\`\`\n${output.slice(0, 6000)}\n\`\`\``,
              labels: ['security', 'devops']
            });
      - name: Fail if audit found vulnerabilities
        if: steps.cargo_audit.outcome == 'failure'
        run: exit 1

  terraform-plan:
    name: terraform plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      AWS_REGION: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
      TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ vars.SUPABASE_ORGANIZATION_ID }}
      TF_VAR_supabase_db_password: ${{ secrets.SUPABASE_DB_PASSWORD }}
      TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
      TF_VAR_vercel_team_id: ${{ vars.VERCEL_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform fmt check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
      - name: Terraform init
        id: init
        run: terraform init -input=false
        continue-on-error: true
      - name: Terraform validate
        id: validate
        run: terraform validate -no-color
        continue-on-error: true
      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -lock-timeout=5m 2>&1 | tee /tmp/terraform-plan.txt; exit ${PIPESTATUS[0]}
        continue-on-error: true
      - name: Post plan results as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/terraform-plan.txt', 'utf8');
            } catch (e) {
              output = '(no plan output captured)';
            }
            const status = '${{ steps.plan.outcome }}' === 'success' ? '✅' : '❌';
            const fmt = '${{ steps.fmt.outcome }}' === 'success' ? '✅' : '❌';
            const init = '${{ steps.init.outcome }}' === 'success' ? '✅' : '❌';
            const validate = '${{ steps.validate.outcome }}' === 'success' ? '✅' : '❌';
            const body = [
              `### ${status} terraform plan`,
              '',
              '| Step | Result |',
              '| ---- | ------ |',
              `| fmt | ${fmt} |`,
              `| init | ${init} |`,
              `| validate | ${validate} |`,
              `| plan | ${status} |`,
              '',
              '<details><summary>Show plan diff</summary>',
              '',
              '```',
              output.slice(0, 60000),
              '```',
              '',
              '</details>'
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
      - name: Fail if terraform plan failed
        if: steps.fmt.outcome == 'failure' || steps.init.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.plan.outcome == 'failure'
        run: exit 1
